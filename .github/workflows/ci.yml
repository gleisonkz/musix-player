name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core + audio engine tests
        run: swift test --package-path Core

  build-ipa:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project MusixPlayer.xcodeproj -scheme MusixPlayer -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/MusixPlayer.app out/Payload/
          (cd out && zip -qry ../MusixPlayer.ipa Payload)
          ls -lh MusixPlayer.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MusixPlayer-ipa
          path: MusixPlayer.ipa
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest MusixPlayer.ipa --prerelease \
            --title "Build #${{ github.run_number }}" \
            --notes "Unsigned build from ${{ github.sha }}. Install with Sideloadly using your Apple ID."
